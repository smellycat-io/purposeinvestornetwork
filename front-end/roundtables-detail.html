<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roundtable | Purpose Investor Network</title>
  <link rel="icon" href="/imgs/logos/favicon.png" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/nav.css" />
</head>
<body>
  <div class="site-topbar" id="site-topbar"></div>
  <script src="/nav.js"></script>
  <script>renderBackendNav();</script>

  <div id="banner-slot"></div>

  <div class="page-shell">
    <main>
      <p class="breadcrumb"><a href="/roundtables">&larr; All roundtables</a></p>

      <div id="roundtable-content">
        <p class="muted">Loading roundtable&hellip;</p>
      </div>
    </main>

    <footer class="footer">Purpose Investor Network &bull; Empowering purpose-driven investment journeys</footer>
  </div>

  <script src="/dom-utils.js"></script>
  <script src="/component/card.js"></script>
  <script src="/component/banner.js"></script>
  <script src="/component/detail-page.js"></script>
  <script>
    renderDetailPage({
      contentElId: 'roundtable-content',
      bannerSlotId: 'banner-slot',
      load: (slug) => fetchJson(`/api/roundtables/${encodeURIComponent(slug)}`),
      pageTitle: (data) => `${data.roundtable.name} | Purpose Investor Network`,
      mapBanner: (data) => ({ imageUrl: data.roundtable.imageUrl, title: data.roundtable.name, description: data.roundtable.description }),
      renderBody: ({ initiatives, updates }) => {
        const initiativesById = {};
        initiatives.forEach((i) => { initiativesById[i.id] = i; });

        const initiativesHtml = initiatives.length
          ? initiatives.map((i) => linkCardHtml({
              href: `/roundtables/initiatives/${encodeURIComponent(i.slug)}`,
              imageUrl: i.imageUrl,
              title: i.title,
              description: i.description,
              headingLevel: 4,
            })).join('')
          : '<p class="muted">No initiatives have been added to this roundtable yet.</p>';

        const updatesHtml = updates.length
          ? updates.map((u) => {
              const initiative = initiativesById[u.initiativeId];
              return updateCardHtml(u, {
                initiativeLink: initiative
                  ? { href: `/roundtables/initiatives/${encodeURIComponent(initiative.slug)}`, label: initiative.title }
                  : null,
              });
            }).join('')
          : '<p class="muted">No updates have been posted yet.</p>';

        return `
          <section class="content-section">
            <h3>Initiatives</h3>
            <div class="card-grid">${initiativesHtml}</div>
          </section>

          <section class="content-section">
            <h3>Latest updates</h3>
            <div class="update-list">${updatesHtml}</div>
          </section>
        `;
      },
      notFoundText: 'We couldn’t find that roundtable. It may have been renamed or removed.',
      errorText: 'Unable to load this roundtable right now. Please try again later.',
    });
  </script>
</body>
</html>
