<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | Purpose Investor Network</title>
  <link rel="icon" href="/imgs/logos/favicon.png" />
</head>
<body style="font-family:system-ui, sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; background:#f5f3ef; margin:0;">
  <div style="background:#ffffff; padding:32px; border-radius:16px; box-shadow:0 16px 40px rgba(0,0,0,0.08); width:340px;">
    <h1 style="margin:0 0 20px;font-size:22px;">Set a new password</h1>

    <form id="rp-form">
      <label style="display:block; margin-bottom:10px; font-weight:600;">New password</label>
      <input type="password" id="rp-password" required minlength="8" style="width:100%;padding:10px;margin-bottom:16px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box;" />
      <label style="display:block; margin-bottom:10px; font-weight:600;">Confirm password</label>
      <input type="password" id="rp-confirm" required minlength="8" style="width:100%;padding:10px;margin-bottom:20px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box;" />
      <button type="submit" style="width:100%;background:#d70010;color:#fff;border:none;padding:12px 0;border-radius:999px;font-weight:700;cursor:pointer;">Set password</button>
    </form>

    <p id="rp-message" style="display:none;margin-top:16px;font-size:14px;"></p>
  </div>

  <script src="/dom-utils.js"></script>
  <script>
    (function () {
      const token = new URLSearchParams(window.location.search).get('token');
      const form = document.getElementById('rp-form');
      const messageEl = document.getElementById('rp-message');

      if (!token) {
        form.style.display = 'none';
        messageEl.textContent = 'This reset link is missing its token. Please use the link from your email.';
        messageEl.style.color = '#d70010';
        messageEl.style.display = 'block';
        return;
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const newPassword = document.getElementById('rp-password').value;
        const confirm = document.getElementById('rp-confirm').value;
        if (newPassword !== confirm) {
          messageEl.textContent = 'Passwords do not match.';
          messageEl.style.color = '#d70010';
          messageEl.style.display = 'block';
          return;
        }
        try {
          const res = await fetch('/api/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, newPassword }),
          });
          const body = await res.json();
          if (!res.ok) {
            messageEl.textContent = body.error || 'Unable to reset password.';
            messageEl.style.color = '#d70010';
            messageEl.style.display = 'block';
            return;
          }
          form.style.display = 'none';
          messageEl.innerHTML = 'Password updated. <a href="/login">Log in</a>.';
          messageEl.style.color = '#1a7a1a';
          messageEl.style.display = 'block';
        } catch (err) {
          messageEl.textContent = 'Something went wrong. Please try again.';
          messageEl.style.color = '#d70010';
          messageEl.style.display = 'block';
        }
      });
    })();
  </script>
</body>
</html>
