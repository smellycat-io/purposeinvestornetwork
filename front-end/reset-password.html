<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | Purpose Investor Network</title>
  <link rel="icon" href="/imgs/logos/favicon.png" />
  <link rel="stylesheet" href="/auth-card.css" />
</head>
<body class="auth-body">
  <div class="auth-card">
    <h1>Set a new password</h1>

    <form id="rp-form">
      <label>New password</label>
      <input type="password" id="rp-password" required minlength="8" />
      <label>Confirm password</label>
      <input type="password" id="rp-confirm" required minlength="8" />
      <button type="submit">Set password</button>
    </form>

    <p id="rp-message" class="auth-message" hidden></p>
  </div>

  <script src="/dom-utils.js"></script>
  <script>
    (function () {
      const token = new URLSearchParams(window.location.search).get('token');
      const form = document.getElementById('rp-form');
      const messageEl = document.getElementById('rp-message');

      function showMessage(html, kind) {
        messageEl.innerHTML = html;
        messageEl.className = 'auth-message ' + kind;
        messageEl.hidden = false;
      }

      if (!token) {
        form.hidden = true;
        showMessage('This reset link is missing its token. Please use the link from your email.', 'error');
        return;
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const newPassword = document.getElementById('rp-password').value;
        const confirm = document.getElementById('rp-confirm').value;
        if (newPassword !== confirm) {
          showMessage('Passwords do not match.', 'error');
          return;
        }
        try {
          await fetchJson('/api/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, newPassword }),
          });
          form.hidden = true;
          showMessage('Password updated. <a href="/login">Log in</a>.', 'success');
        } catch (err) {
          showMessage(escapeHtml(err.message), 'error');
        }
      });
    })();
  </script>
</body>
</html>
