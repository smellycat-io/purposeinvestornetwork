<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accept Invite | Purpose Investor Network</title>
  <link rel="icon" href="/imgs/logos/favicon.png" />
  <link rel="stylesheet" href="/auth-card.css" />
</head>
<body class="auth-body">
  <div class="auth-card">
    <h1>Set up your account</h1>

    <form id="ai-form">
      <label>First name</label>
      <input id="ai-first-name" required />
      <label>Last name</label>
      <input id="ai-last-name" required />
      <label>Phone</label>
      <input type="tel" id="ai-phone" />
      <label>Address</label>
      <input id="ai-address" />
      <label>Password</label>
      <input type="password" id="ai-password" required minlength="8" />
      <label>Confirm password</label>
      <input type="password" id="ai-confirm" required minlength="8" />
      <button type="submit">Create account</button>
    </form>

    <p id="ai-message" class="auth-message" hidden></p>
  </div>

  <script src="/dom-utils.js"></script>
  <script>
    (function () {
      const token = new URLSearchParams(window.location.search).get('token');
      const form = document.getElementById('ai-form');
      const messageEl = document.getElementById('ai-message');

      function showMessage(html, kind) {
        messageEl.innerHTML = html;
        messageEl.className = 'auth-message ' + kind;
        messageEl.hidden = false;
      }

      if (!token) {
        form.hidden = true;
        showMessage('This invite link is missing its token. Please use the link from your email.', 'error');
        return;
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const firstName = document.getElementById('ai-first-name').value.trim();
        const lastName = document.getElementById('ai-last-name').value.trim();
        const phone = document.getElementById('ai-phone').value.trim();
        const address = document.getElementById('ai-address').value.trim();
        const password = document.getElementById('ai-password').value;
        const confirm = document.getElementById('ai-confirm').value;
        if (password !== confirm) {
          showMessage('Passwords do not match.', 'error');
          return;
        }
        try {
          await fetchJson('/api/accept-invite', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, firstName, lastName, phone, address, password }),
          });
          form.hidden = true;
          showMessage('Account created. <a href="/login">Log in</a>.', 'success');
        } catch (err) {
          showMessage(escapeHtml(err.message), 'error');
        }
      });
    })();
  </script>
</body>
</html>
