<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PIN Updates | Purpose Investor Network</title>
  <link rel="icon" href="/imgs/logos/favicon.png" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/nav.css" />
  <link rel="stylesheet" href="/component/archive.css" />
</head>
<body>
  <div class="site-topbar" id="site-topbar"></div>
  <script src="/nav.js"></script>
  <script>renderBackendNav();</script>

  <div class="page-banner" style="background-image: url('/imgs/stock/collaboration-coffee-blurred.jpg');">
    <div class="page-banner__inner">
      <div class="page-banner-text">
        <h2>PIN Updates</h2>
        <p>Roundtable and Initiative launches, event announcements, recaps, and general PIN news.</p>
      </div>
    </div>
  </div>

  <div class="page-shell">
    <main>
      <div id="updates-list" class="update-list">
        <p class="muted">Loading&hellip;</p>
      </div>
    </main>
  </div>

  <div id="where-we-started"></div>

  <div class="page-shell">
    <footer class="footer">Purpose Investor Network &bull; Empowering purpose-driven investment journeys</footer>
  </div>

  <script src="/dom-utils.js"></script>
  <script src="/component/list-page.js"></script>
  <script>
    renderListPage({
      endpoint: '/api/updates',
      lists: [{
        containerId: 'updates-list',
        emptyText: 'No updates have been posted yet. Check back soon.',
        errorText: 'Unable to load updates right now. Please try again later.',
        itemHtml: (post) => `
          <a class="update-card update-card--link" href="/updates/${encodeURIComponent(post.slug)}">
            <div class="update-meta">
              <span>${escapeHtml(formatDate(post.publishedAt))}</span>
              ${post.author ? `<span>&bull; ${escapeHtml(post.author)}</span>` : ''}
            </div>
            <h4>${escapeHtml(post.title)}</h4>
          </a>
        `,
      }],
    });
  </script>

  <!-- "Where We Started" — hardcoded archive section, not database-driven.
       Swap REAL content in by editing this array; layout code lives in
       /component/archive.js and needs no changes. -->
  <script src="/component/video-facade.js"></script>
  <script src="/component/archive.js"></script>
  <script>
    var WHERE_WE_STARTED_ENTRIES = [
      {
        title: 'Two Decades on Wall Street',
        date: '1996–2016',
        description: 'Curt Bassett spent two decades leading family office services for Merrill Lynch’s wealthiest clients out of New York — the work that would eventually shape PIN’s approach to mentoring the next generation.',
        imageUrl: '/imgs/stock/new-york.jpg',
      },
      {
        title: 'A Chapter at Zions Bank',
        date: '2016–2017',
        description: 'Zions Bank brought Curt on to build a similar service in-house in Salt Lake City, with plans to keep running PIN alongside it — until banking compliance called time on the experiment.',
        imageUrl: '/imgs/stock/slc.jpg',
      },
      {
        title: 'The Third Impact',
        date: '2018–2019',
        description: 'Curt wrote and launched The Third Impact at a UN Impact Investing conference, laying out the case for using Impact Investing to prepare the next generation for inheritance.',
        videoUrl: 'https://youtu.be/M4De9dSVDoc',
      },
      {
        title: 'Bringing PIN Back',
        date: '2020–Today',
        description: 'Consulting engagements with families across the country reignited the idea — and PIN began rebuilding as a national community of purpose-driven investors.',
        imageUrl: '/imgs/stock/mingle.jpg',
      },
    ];

    document.getElementById('where-we-started').innerHTML = whereWeStartedHtml(WHERE_WE_STARTED_ENTRIES, {
      intro: 'Before the Roundtables and the dashboard, PIN was one person’s idea. A look back at how it got here.',
    });
  </script>
</body>
</html>
