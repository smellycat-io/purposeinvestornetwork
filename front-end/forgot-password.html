<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | Purpose Investor Network</title>
  <link rel="icon" href="/imgs/logos/favicon.png" />
</head>
<body style="font-family:system-ui, sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; background:#f5f3ef; margin:0;">
  <div style="background:#ffffff; padding:32px; border-radius:16px; box-shadow:0 16px 40px rgba(0,0,0,0.08); width:340px;">
    <h1 style="margin:0 0 12px;font-size:22px;">Reset your password</h1>
    <p id="fp-intro" style="margin:0 0 20px;color:#666;font-size:14px;">Enter the email on your admin account and we'll send you a reset link.</p>

    <form id="fp-form">
      <label style="display:block; margin-bottom:10px; font-weight:600;">Email</label>
      <input type="email" id="fp-email" required style="width:100%;padding:10px;margin-bottom:20px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box;" />
      <button type="submit" style="width:100%;background:#d70010;color:#fff;border:none;padding:12px 0;border-radius:999px;font-weight:700;cursor:pointer;">Send reset link</button>
    </form>

    <p id="fp-message" style="display:none;margin-top:16px;font-size:14px;"></p>
    <p style="text-align:center;margin-top:16px;"><a href="/login" style="color:#666;font-size:14px;">Back to login</a></p>
  </div>

  <script src="/dom-utils.js"></script>
  <script>
    document.getElementById('fp-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const email = document.getElementById('fp-email').value.trim();
      const form = document.getElementById('fp-form');
      const messageEl = document.getElementById('fp-message');
      try {
        const res = await fetch('/api/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        const body = await res.json();
        form.style.display = 'none';
        document.getElementById('fp-intro').style.display = 'none';
        messageEl.textContent = body.message || 'If that email is registered, a reset link has been sent.';
        messageEl.style.display = 'block';
      } catch (err) {
        messageEl.textContent = 'Something went wrong. Please try again.';
        messageEl.style.color = '#d70010';
        messageEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
