<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | Purpose Investor Network</title>
  <link rel="icon" href="/imgs/logos/favicon.png" />
  <link rel="stylesheet" href="/auth-card.css" />
</head>
<body class="auth-body">
  <div class="auth-card">
    <h1>Reset your password</h1>
    <p class="auth-intro" id="fp-intro">Enter the email on your admin account and we'll send you a reset link.</p>

    <form id="fp-form">
      <label>Email</label>
      <input type="email" id="fp-email" required />
      <button type="submit">Send reset link</button>
    </form>

    <p id="fp-message" class="auth-message" hidden></p>
    <p class="auth-link"><a href="/login">Back to login</a></p>
  </div>

  <script src="/dom-utils.js"></script>
  <script>
    document.getElementById('fp-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const email = document.getElementById('fp-email').value.trim();
      const form = document.getElementById('fp-form');
      const messageEl = document.getElementById('fp-message');
      try {
        const body = await fetchJson('/api/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        form.hidden = true;
        document.getElementById('fp-intro').hidden = true;
        messageEl.textContent = body.message || 'If that email is registered, a reset link has been sent.';
        messageEl.className = 'auth-message success';
        messageEl.hidden = false;
      } catch (err) {
        messageEl.textContent = 'Something went wrong. Please try again.';
        messageEl.className = 'auth-message error';
        messageEl.hidden = false;
      }
    });
  </script>
</body>
</html>
