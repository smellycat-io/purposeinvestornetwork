<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Update | Purpose Investor Network</title>
  <link rel="icon" href="/imgs/logos/favicon.png" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/nav.css" />
</head>
<body>
  <div class="site-topbar" id="site-topbar"></div>
  <script src="/nav.js"></script>
  <script>renderBackendNav();</script>

  <div class="page-shell">
    <main>
      <p class="breadcrumb"><a href="/updates">&larr; All updates</a></p>

      <div id="update-content">
        <p class="muted">Loading update&hellip;</p>
      </div>
    </main>

    <footer class="footer">Purpose Investor Network &bull; Empowering purpose-driven investment journeys</footer>
  </div>

  <script src="/dom-utils.js"></script>
  <script src="/component/detail-page.js"></script>
  <script>
    renderDetailPage({
      contentElId: 'update-content',
      useBanner: false,
      load: (slug) => fetchJson(`/api/updates/${encodeURIComponent(slug)}`),
      pageTitle: (post) => `${post.title} | Purpose Investor Network`,
      renderBody: (post) => {
        const metaLine = `${post.author ? escapeHtml(post.author) + ' &bull; ' : ''}${escapeHtml(formatDate(post.publishedAt))}`;
        return `
          <div class="page-heading">
            <h2>${escapeHtml(post.title)}</h2>
            <p class="muted">${metaLine}</p>
          </div>
          <section class="content-section">
            <div class="update-body">${post.body || ''}</div>
          </section>
        `;
      },
      notFoundText: 'We couldn’t find that update. It may have been renamed or removed.',
      errorText: 'Unable to load this update right now. Please try again later.',
    });
  </script>
</body>
</html>
