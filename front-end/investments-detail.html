<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Investment | Purpose Investor Network</title>
  <link rel="icon" href="/imgs/logos/favicon.png" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/nav.css" />
</head>
<body>
  <div class="site-topbar" id="site-topbar"></div>
  <script src="/nav.js"></script>
  <script>renderBackendNav();</script>

  <div id="banner-slot"></div>

  <div class="page-shell">
    <main>
      <p class="breadcrumb"><a href="/investments">&larr; All investments</a></p>

      <div id="investment-content">
        <p class="muted">Loading investment&hellip;</p>
      </div>
    </main>

    <footer class="footer">Purpose Investor Network &bull; Empowering purpose-driven investment journeys</footer>
  </div>

  <script src="/dom-utils.js"></script>
  <script src="/component/banner.js"></script>
  <script src="/component/detail-page.js"></script>
  <script>
    renderDetailPage({
      contentElId: 'investment-content',
      bannerSlotId: 'banner-slot',
      load: (slug) => fetchJson(`/api/investments/${encodeURIComponent(slug)}`),
      pageTitle: (inv) => `${inv.title} | Purpose Investor Network`,
      mapBanner: (inv) => ({ imageUrl: inv.imageUrl, title: inv.title, description: inv.description }),
      renderBody: (inv) => {
        const outcomeHtml = inv.outcomeSummary
          ? `<section class="content-section"><h3>Outcome</h3><div class="update-body">${inv.outcomeSummary}</div></section>`
          : '';
        return `
          <p class="muted">Status: ${inv.status === 'completed' ? 'Completed' : 'Open'}</p>
          <section class="content-section">
            <div class="update-body">${inv.description || ''}</div>
          </section>
          ${outcomeHtml}
        `;
      },
      notFoundText: 'We couldn’t find that investment. It may have been renamed, removed, or is members-only.',
      errorText: 'Unable to load this investment right now. Please try again later.',
    });
  </script>
</body>
</html>
