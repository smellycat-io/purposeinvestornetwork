<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Initiative | Purpose Investor Network</title>
  <link rel="icon" href="/imgs/logos/favicon.png" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/nav.css" />
</head>
<body>
  <div class="site-topbar" id="site-topbar"></div>
  <script src="/nav.js"></script>
  <script>renderBackendNav();</script>

  <div id="banner-slot"></div>

  <div class="page-shell">
    <main>
      <p class="breadcrumb"><a href="/roundtables">&larr; All roundtables</a></p>

      <div id="initiative-content">
        <p class="muted">Loading initiative&hellip;</p>
      </div>
    </main>

    <footer class="footer">Purpose Investor Network &bull; Empowering purpose-driven investment journeys</footer>
  </div>

  <script src="/dom-utils.js"></script>
  <script src="/component/card.js"></script>
  <script src="/component/banner.js"></script>
  <script>
    (async function () {
      const contentEl = document.getElementById('initiative-content');
      const slug = lastPathSegment();

      try {
        const [{ initiative, updates }, roundtables] = await Promise.all([
          fetchJson(`/api/initiatives/${encodeURIComponent(slug)}`),
          fetchJson('/api/roundtables').catch(() => []),
        ]);
        document.title = `${initiative.title} | Purpose Investor Network`;

        const parentRoundtables = roundtables.filter((r) => (initiative.roundtableIds || []).includes(r.id));
        const parentsHtml = parentRoundtables.length
          ? `<p class="muted">Part of ${parentRoundtables.map((r) => `<a href="/roundtables/${encodeURIComponent(r.slug)}">${escapeHtml(r.name)}</a>`).join(', ')}</p>`
          : '';

        const updatesHtml = updates.length
          ? updates.map((u) => updateCardHtml(u)).join('')
          : '<p class="muted">No updates have been posted yet.</p>';

        const { bannerHtml, headingHtml } = pageBannerHtml({
          imageUrl: initiative.imageUrl,
          title: initiative.title,
          description: initiative.description,
          extraHtml: parentsHtml,
        });
        document.getElementById('banner-slot').innerHTML = bannerHtml;

        contentEl.innerHTML = `
          ${headingHtml}

          <section class="content-section">
            <h3>Updates</h3>
            <div class="update-list">${updatesHtml}</div>
          </section>
        `;
      } catch (err) {
        if (err.status === 404) {
          contentEl.innerHTML = '<p class="muted">We couldn&rsquo;t find that initiative. It may have been renamed or removed.</p>';
        } else {
          contentEl.innerHTML = '<p class="muted">Unable to load this initiative right now. Please try again later.</p>';
        }
      }
    })();
  </script>
</body>
</html>
