<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roundtable | Purpose Investor Network</title>
  <link rel="icon" href="/imgs/logos/favicon.png" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/nav.css" />
</head>
<body>
  <div class="site-topbar" id="site-topbar"></div>
  <script src="/nav.js"></script>
  <script>renderBackendNav();</script>

  <div id="banner-slot"></div>

  <div class="page-shell">
    <main>
      <p class="breadcrumb"><a href="/roundtables">&larr; All roundtables</a></p>

      <div id="roundtable-content">
        <p class="muted">Loading roundtable&hellip;</p>
      </div>
    </main>

    <footer class="footer">Purpose Investor Network &bull; Empowering purpose-driven investment journeys</footer>
  </div>

  <script src="/content-shared.js"></script>
  <script>
    (async function () {
      const contentEl = document.getElementById('roundtable-content');
      const slug = lastPathSegment();

      try {
        const { roundtable, initiatives, updates } = await fetchJson(`/api/roundtables/${encodeURIComponent(slug)}`);
        document.title = `${roundtable.name} | Purpose Investor Network`;

        const initiativesById = {};
        initiatives.forEach((i) => { initiativesById[i.id] = i; });

        const initiativesHtml = initiatives.length
          ? initiatives.map((i) => `
              <a class="card-link" href="/roundtables/initiatives/${encodeURIComponent(i.slug)}">
                ${cardImageHtml(i.imageUrl)}
                <div class="card-link__body">
                  <h4>${escapeHtml(i.title)}</h4>
                  <p>${escapeHtml(i.description)}</p>
                </div>
              </a>
            `).join('')
          : '<p class="muted">No initiatives have been added to this roundtable yet.</p>';

        const updatesHtml = updates.length
          ? updates.map((u) => {
              const initiative = initiativesById[u.initiativeId];
              return `
                <article class="update-card">
                  <div class="update-meta">
                    ${initiative ? `<a href="/roundtables/initiatives/${encodeURIComponent(initiative.slug)}">${escapeHtml(initiative.title)}</a> &bull; ` : ''}
                    <span>${escapeHtml(formatDate(u.publishedAt))}</span>
                    ${u.author ? `<span>&bull; ${escapeHtml(u.author)}</span>` : ''}
                  </div>
                  <h4>${escapeHtml(u.title)}</h4>
                  <div class="update-body">${u.body}</div>
                </article>
              `;
            }).join('')
          : '<p class="muted">No updates have been posted yet.</p>';

        const bannerSlot = document.getElementById('banner-slot');
        if (roundtable.imageUrl) {
          bannerSlot.innerHTML = `
            <div class="page-banner" style="background-image: url('${escapeHtml(roundtable.imageUrl)}');">
              <div class="page-banner__inner">
                <div class="page-banner-text">
                  <h2>${escapeHtml(roundtable.name)}</h2>
                  <p>${escapeHtml(roundtable.description)}</p>
                </div>
              </div>
            </div>
          `;
        }
        const headingHtml = roundtable.imageUrl ? '' : `
          <div class="page-heading">
            <h2>${escapeHtml(roundtable.name)}</h2>
            <p>${escapeHtml(roundtable.description)}</p>
          </div>
        `;

        contentEl.innerHTML = `
          ${headingHtml}

          <section class="content-section">
            <h3>Initiatives</h3>
            <div class="card-grid">${initiativesHtml}</div>
          </section>

          <section class="content-section">
            <h3>Latest updates</h3>
            <div class="update-list">${updatesHtml}</div>
          </section>
        `;
      } catch (err) {
        if (err.status === 404) {
          contentEl.innerHTML = '<p class="muted">We couldn&rsquo;t find that roundtable. It may have been renamed or removed.</p>';
        } else {
          contentEl.innerHTML = '<p class="muted">Unable to load this roundtable right now. Please try again later.</p>';
        }
      }
    })();
  </script>
</body>
</html>
