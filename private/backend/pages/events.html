<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Events | Purpose Investor Network</title>
  <link rel="icon" href="/imgs/logos/favicon.png" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/nav.css" />
</head>
<body>
  <div class="site-topbar" id="site-topbar"></div>
  <script src="/nav.js"></script>
  <script>renderBackendNav();</script>

  <div class="page-banner" style="background-image: url('/imgs/stock/mingle.jpg');">
    <div class="page-banner__inner">
      <div class="page-banner-text">
        <h2>Events</h2>
        <p>Upcoming and past PIN gatherings &mdash; see our <a href="/conference">flagship Conference series</a>.</p>
      </div>
    </div>
  </div>

  <div class="page-shell">
    <main>
      <section class="content-section">
        <h3>Upcoming</h3>
        <div id="upcoming-events-list" class="card-grid">
          <p class="muted">Loading&hellip;</p>
        </div>
      </section>

      <section class="content-section">
        <h3>Past</h3>
        <div id="past-events-list" class="card-grid">
          <p class="muted">Loading&hellip;</p>
        </div>
      </section>
    </main>

    <footer class="footer">Purpose Investor Network &bull; Empowering purpose-driven investment journeys</footer>
  </div>

  <script src="/dom-utils.js"></script>
  <script src="/component/card.js"></script>
  <script>
    (async function () {
      const upcomingEl = document.getElementById('upcoming-events-list');
      const pastEl = document.getElementById('past-events-list');
      try {
        const events = await fetchJson('/api/events');
        const now = new Date();
        const upcoming = events.filter((e) => new Date(e.startsAt) >= now);
        const past = events.filter((e) => new Date(e.startsAt) < now).reverse();

        const renderList = (list) => list.length
          ? list.map((e) => linkCardHtml({
              href: `/events/${encodeURIComponent(e.slug)}`,
              imageUrl: e.imageUrl,
              title: e.title,
              description: `${formatDate(e.startsAt)}${e.location ? ' — ' + e.location : ''}`,
              headingLevel: 3,
            })).join('')
          : '<p class="muted">Nothing here yet.</p>';

        upcomingEl.innerHTML = renderList(upcoming);
        pastEl.innerHTML = renderList(past);
      } catch (err) {
        upcomingEl.innerHTML = '<p class="muted">Unable to load events right now. Please try again later.</p>';
        pastEl.innerHTML = '';
      }
    })();
  </script>
</body>
</html>
