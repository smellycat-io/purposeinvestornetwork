<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conference | Purpose Investor Network</title>
  <link rel="icon" href="/imgs/logos/favicon.png" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/nav.css" />
</head>
<body>
  <div class="site-topbar" id="site-topbar"></div>
  <script src="/nav.js"></script>
  <script>renderBackendNav();</script>

  <div class="page-banner" style="background-image: url('/imgs/stock/workshop.jpg');">
    <div class="page-banner__inner">
      <div class="page-banner-text">
        <h2>The PIN Conference</h2>
        <p>Our flagship annual gathering &mdash; see the full <a href="/events">events calendar</a>.</p>
      </div>
    </div>
  </div>

  <div class="page-shell">
    <main>
      <div id="conference-list" class="card-grid">
        <p class="muted">Loading&hellip;</p>
      </div>
    </main>

    <footer class="footer">Purpose Investor Network &bull; Empowering purpose-driven investment journeys</footer>
  </div>

  <script src="/dom-utils.js"></script>
  <script src="/component/card.js"></script>
  <script>
    (async function () {
      const listEl = document.getElementById('conference-list');
      try {
        const events = await fetchJson('/api/events?conference=true');
        if (!events.length) {
          listEl.innerHTML = '<p class="muted">No Conference events have been published yet. Check back soon.</p>';
          return;
        }
        listEl.innerHTML = events.map((e) => linkCardHtml({
          href: `/events/${encodeURIComponent(e.slug)}`,
          imageUrl: e.imageUrl,
          title: e.title,
          description: `${formatDate(e.startsAt)}${e.location ? ' — ' + e.location : ''}`,
          headingLevel: 3,
        })).join('');
      } catch (err) {
        listEl.innerHTML = '<p class="muted">Unable to load the Conference series right now. Please try again later.</p>';
      }
    })();
  </script>
</body>
</html>
