<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conference | Purpose Investor Network</title>
  <link rel="icon" href="/imgs/logos/favicon.png" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/nav.css" />
  <link rel="stylesheet" href="/component/archive.css" />
</head>
<body>
  <div class="site-topbar" id="site-topbar"></div>
  <script src="/nav.js"></script>
  <script>renderBackendNav();</script>

  <div class="page-banner" style="background-image: url('/imgs/stock/workshop.jpg');">
    <div class="page-banner__inner">
      <div class="page-banner-text">
        <h2>The PIN Conference</h2>
        <p>Our flagship annual gathering &mdash; see the full <a href="/events">events calendar</a>.</p>
      </div>
    </div>
  </div>

  <div class="page-shell">
    <main>
      <div id="conference-list" class="card-grid">
        <p class="muted">Loading&hellip;</p>
      </div>
    </main>
  </div>

  <div id="where-we-started"></div>

  <div class="page-shell">
    <footer class="footer">Purpose Investor Network &bull; Empowering purpose-driven investment journeys</footer>
  </div>

  <script src="/dom-utils.js"></script>
  <script src="/component/card.js"></script>
  <script>
    (async function () {
      const listEl = document.getElementById('conference-list');
      try {
        const events = await fetchJson('/api/events?conference=true');
        if (!events.length) {
          listEl.innerHTML = '<p class="muted">No Conference events have been published yet. Check back soon.</p>';
          return;
        }
        listEl.innerHTML = events.map((e) => linkCardHtml({
          href: `/events/${encodeURIComponent(e.slug)}`,
          imageUrl: e.imageUrl,
          title: e.title,
          description: `${formatDate(e.startsAt)}${e.location ? ' — ' + e.location : ''}`,
          headingLevel: 3,
        })).join('');
      } catch (err) {
        listEl.innerHTML = '<p class="muted">Unable to load the Conference series right now. Please try again later.</p>';
      }
    })();
  </script>

  <!-- "Where We Started" — hardcoded archive section, not database-driven.
       Swap REAL content in by editing this array; layout code lives in
       /component/archive.js and needs no changes. -->
  <script src="/component/video-facade.js"></script>
  <script src="/component/archive.js"></script>
  <script>
    var WHERE_WE_STARTED_ENTRIES = [
      {
        title: 'The First Showcase',
        date: 'November 2017',
        description: 'Members gathered at Zions Bank’s headquarters for a showcase of vetted investments — the format that would eventually grow into the annual Conference.',
        imageUrl: '/imgs/stock/workshop.jpg',
      },
      {
        title: 'Finding Our Voice',
        date: '2019',
        description: 'The Third Impact launched at a UN Impact Investing conference, putting PIN’s mentoring model in front of a national audience for the first time.',
        videoUrl: 'https://youtu.be/M4De9dSVDoc',
      },
      {
        title: 'Growing the Room',
        date: '2021',
        description: 'As PIN rebuilt, so did the gathering — smaller rooms, bigger conversations, and the first cross-Roundtable collaborations.',
        imageUrl: '/imgs/stock/speaker.jpg',
      },
      {
        title: 'A National Gathering',
        date: 'Today',
        description: 'What started as a single showcase is now PIN’s flagship annual Conference, bringing members together from Roundtables across the country.',
        imageUrl: '/imgs/stock/collab_table.jpg',
      },
    ];

    document.getElementById('where-we-started').innerHTML = whereWeStartedHtml(WHERE_WE_STARTED_ENTRIES, {
      heading: 'Where the Conference Started',
      intro: 'From a single showcase at a bank headquarters to PIN’s flagship annual gathering.',
    });
  </script>
</body>
</html>
