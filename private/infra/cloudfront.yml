AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Purpose Investor Network — API Gateway in front of the existing backend
  Lambda. Does NOT create the Lambda, its IAM role, or a CloudFront
  distribution — the Lambda/role already exist (managed by GitHub Actions),
  and the CloudFront distribution (E20BW0W9XR1KU3) already exists too and is
  extended separately via private/infra/patch-cloudfront-distribution.js, since it
  predates this template and isn't CloudFormation-managed.

Parameters:
  ExistingLambdaArn:
    Type: String
    Default: arn:aws:lambda:us-east-1:110695445537:function:purpose-investor-network-backend-pin-backend
    Description: ARN of the already-deployed backend Lambda function
  ExistingLambdaFunctionName:
    Type: String
    Default: purpose-investor-network-backend-pin-backend
    Description: Name of the already-deployed backend Lambda function
  SiteDomain:
    Type: String
    Default: purposeinvestornetwork.org
  WWWDomain:
    Type: String
    Default: www.purposeinvestornetwork.org

Resources:
  BackendApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: purpose-investor-network-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - !Sub 'https://${SiteDomain}'
          - !Sub 'https://${WWWDomain}'
        AllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
        AllowHeaders: ['*']
        AllowCredentials: true

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref BackendApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ExistingLambdaArn}/invocations
      PayloadFormatVersion: '2.0'

  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref BackendApi
      RouteKey: $default
      Target: !Sub integrations/${ApiIntegration}

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref BackendApi
      StageName: $default
      AutoDeploy: true

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ExistingLambdaFunctionName
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${BackendApi}/*

Outputs:
  ApiEndpoint:
    Description: Direct API Gateway endpoint (full https:// URL)
    Value: !GetAtt BackendApi.ApiEndpoint
  ApiDomainOnly:
    Description: Just the hostname, for patching the CloudFront origin
    Value: !Select [1, !Split ['//', !GetAtt BackendApi.ApiEndpoint]]
