AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Purpose Investor Network content tables — Roundtables, Initiatives, Posts,
  Images, Press, Investments, and Events. Posts is a single unified table for
  blog posts, initiative updates, education articles, PIN announcements, and
  the "Buy the Book" module (distinguished by a "type" attribute), since
  they're the same shape: timestamped, rich-text, shown in a feed. Images is
  a library of uploaded image metadata (S3 key/URL + upload info) that
  admins can browse and reuse. Investments and Events get their own tables
  since their fields (deal status/outcome, dates) don't fit the Posts shape.

Resources:
  RoundtablesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: purpose-investor-network-roundtables
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  InitiativesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: purpose-investor-network-initiatives
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  PostsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: purpose-investor-network-posts
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  ImagesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: purpose-investor-network-images
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  PressTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: purpose-investor-network-press
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  InvestmentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: purpose-investor-network-investments
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: purpose-investor-network-events
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  # Single-row app settings (admin-editable notification email + password
  # hash) — deliberately DynamoDB, not the local JSON store, since that store
  # lives at /tmp in Lambda and gets wiped on cold start. A subscriber
  # signup getting lost to that is a shrug; the admin's password silently
  # reverting to an old value is a lockout waiting to happen.
  SettingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: purpose-investor-network-settings
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

Outputs:
  RoundtablesTableName:
    Value: !Ref RoundtablesTable
  InitiativesTableName:
    Value: !Ref InitiativesTable
  PostsTableName:
    Value: !Ref PostsTable
  ImagesTableName:
    Value: !Ref ImagesTable
  PressTableName:
    Value: !Ref PressTable
  InvestmentsTableName:
    Value: !Ref InvestmentsTable
  EventsTableName:
    Value: !Ref EventsTable
  SettingsTableName:
    Value: !Ref SettingsTable
